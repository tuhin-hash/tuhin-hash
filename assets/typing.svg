<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 80" width="100%" height="80">
  <defs>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFAA33" />
      <stop offset="50%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#FFAA33" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .terminal-container {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .prompt {
      fill: #FFAA33;
      font-size: 22px;
      font-weight: 800;
      filter: url(#glow);
    }
    .bracket {
      fill: #888888;
      font-size: 18px;
    }
    .cursor {
      fill: #FFAA33;
      animation: blink 0.8s infinite;
      filter: url(#glow);
    }
    .text-line {
      font-size: 22px;
      font-weight: 600;
      fill: url(#neonOrange);
      filter: url(#glow);
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* 4 phrases, 16s total loop (4s each) */
    .phrase-1 {
      animation: cycle1 16s infinite;
    }
    .phrase-2 {
      animation: cycle2 16s infinite;
    }
    .phrase-3 {
      animation: cycle3 16s infinite;
    }
    .phrase-4 {
      animation: cycle4 16s infinite;
    }

    @keyframes cycle1 {
      0%, 22% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
    @keyframes cycle2 {
      0%, 24% { opacity: 0; }
      25%, 47% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes cycle3 {
      0%, 49% { opacity: 0; }
      50%, 72% { opacity: 1; }
      75%, 100% { opacity: 0; }
    }
    @keyframes cycle4 {
      0%, 74% { opacity: 0; }
      75%, 97% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <rect width="100%" height="100%" fill="transparent" />

  <g class="terminal-container" transform="translate(20, 48)">
    <text x="0" y="0" class="prompt">❯</text>
    <text x="25" y="0" class="bracket">[</text>
    <text x="35" y="0" style="fill:#FFAA33; font-size:16px; font-weight:700;">SYSTEMS</text>
    <text x="115" y="0" class="bracket">]:</text>

    <g transform="translate(145, 0)">
      <text class="text-line phrase-1" x="0" y="0">Systems Engineer</text>
      <text class="text-line phrase-2" x="0" y="0">Data Science &amp; AI Enthusiast</text>
      <text class="text-line phrase-3" x="0" y="0">Machine Learning Developer</text>
      <text class="text-line phrase-4" x="0" y="0">Automation &amp; Multi-Agent Builder</text>
    </g>

    <rect x="585" y="-18" width="10" height="22" class="cursor" rx="2" />
  </g>
</svg>
